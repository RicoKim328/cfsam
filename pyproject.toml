# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cfsam"
version = "0.0.0"
description = "cFS Application Manager: import a cFS mission into mission.yaml and validate it"
readme = "CLAUDE.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Rico Kim" }]
requires-python = ">=3.10"
# mission.yaml is written by cfsam.yamlout (stdlib only) and read back by
# cfsam validate with PyYAML.
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cfsam = "cfsam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
